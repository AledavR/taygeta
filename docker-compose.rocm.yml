# ============================================================================
# Taygeta — Override AMD/ROCm (sección 12.2). NO es una definición completa:
# solo modifica el servicio `ocr` sobre el Compose base.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.rocm.yml up --build
#
# No mezclar con docker-compose.cuda.yml.
# ============================================================================
services:
  ocr:
    build:
      context: .
      dockerfile: docker/ocr/Dockerfile.rocm
      # Arquitectura GPU a compilar. Por defecto gfx1030 (RX 6800/6800XT/6900XT).
      # Otros ejemplos: gfx1100 (RX 7900), gfx1031 (RX 6700), gfx900 (Vega).
      args:
        AMDGPU_TARGETS: ${AMDGPU_TARGETS:-gfx1030}
    image: taygeta-ocr:rocm
    # Acceso mínimo a los dispositivos AMD (sin privileged).
    devices:
      - /dev/kfd
      - /dev/dri
    # Grupos de dispositivo habituales en el host (ajustar o eliminar si no
    # se corresponden con la distribución del host).
    group_add:
      - video
      - render
    environment:
      # Override HSA SOLO si ROCm no detecta la GPU de forma nativa. Déjalo SIN
      # definir (se elimina del entorno) para usar detección nativa; NO lo dejes
      # vacío, un valor vacío rompe la detección. Ejemplo RDNA2: 10.3.0.
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-}
      # Workaround gfx1030 (RX 6800/6800XT/6900XT): con ROCm sobre kernels muy
      # recientes, la carga del modelo puede fallar con "Memory access fault ...
      # Page not present or supervisor privilege". Desactivar SDMA evita el fallo
      # (las copias caen a la cola de cómputo; el coste es mínimo). Verificado en
      # RX 6800 XT + kernel 7.x. En RDNA3 (gfx1100) suele no ser necesario:
      # sobrescríbelo con HSA_ENABLE_SDMA=1 si tu GPU no lo requiere.
      HSA_ENABLE_SDMA: ${HSA_ENABLE_SDMA:-0}
      # Capas descargadas a GPU (flag explícito -ngl/--n-gpu-layers). No se usa
      # LLAMA_ARG_N_GPU_LAYERS para evitar el aviso de sobrescritura.
      OCR_GPU_LAYERS: 99
      # Aborta si no se detecta GPU en vez de caer silenciosamente a CPU.
      OCR_REQUIRE_GPU: "1"
    volumes:
      - ocr-models:/models
      - ocr-cache:/cache
