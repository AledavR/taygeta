[project]
name = "taygeta"
version = "0.1.0"
description = "Banco de examenes cientificos y sistema de recuperacion MCP: ingesta hibrida, HITL, RAG y compilacion Typst."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mcp[cli]>=1.3.0,<2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "instructor>=1.7.0",
    "openai>=1.60.0",
    "sentence-transformers>=3.0.0",
    # Se declara como dependencia directa para poder forzar el índice CPU de
    # PyTorch en [tool.uv.sources] (uv solo respeta `sources` para dependencias
    # directas). Evita las ruedas CUDA/NVIDIA en hardware AMD.
    "torch>=2.0.0",
    "pymupdf>=1.25.0",
    "pillow>=11.0.0",
    "streamlit>=1.40.0",
    # Recorte manual de figuras (bounding box) en la revisión HITL.
    "streamlit-cropper>=0.3.1,<1",
    "pandoc>=2.4",
    "boto3>=1.35.0",
    # Conversor LaTeX↔Typst en Rust (tylax) para las fórmulas del transpilador.
    # Wheel abi3 (cp310+) → compatible con Python 3.11; requiere glibc >= 2.34.
    "tylax>=0.3.8,<1",
    "nicegui>=3.18.0",
]

[project.scripts]
taygeta-ingest = "taygeta.ingest.pipeline:main"
taygeta-server = "taygeta.server.mcp_server:main"
taygeta-ui = "taygeta.ui.nice.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taygeta"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pyright>=1.1.414",
    "ruff-lsp>=0.0.62",
]

# ---------------------------------------------------------------------------
# PyTorch para CPU (entorno AMD): la rueda genérica de PyPI arrastra grandes
# dependencias CUDA/NVIDIA a través de sentence-transformers. Se fija un índice
# explícito con las compilaciones +cpu, usado solo por los paquetes de PyTorch.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
